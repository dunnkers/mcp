name: Deploy hevy-mcp Worker

on:
  push:
    branches:
      - main
    paths:
      - servers/hevy-mcp/**
      - .github/workflows/deploy-hevy-mcp.yml
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: servers/hevy-mcp

concurrency:
  group: deploy-hevy-mcp-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker to Cloudflare
    runs-on: ubuntu-latest
    environment:
      name: hevy-mcp-production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: servers/hevy-mcp/.nvmrc
          cache: npm
          cache-dependency-path: servers/hevy-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_OAUTH_KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_OAUTH_KV_NAMESPACE_ID }}
        run: npx wrangler deploy --x-new-config
