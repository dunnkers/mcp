name: Deploy vinted-mcp Worker

on:
  push:
    branches:
      - main
    paths:
      - servers/vinted-mcp/**
      - .github/workflows/deploy-vinted-mcp.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-vinted-mcp-worker
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            servers/vinted-mcp/package-lock.json
            servers/vinted-mcp/worker/package-lock.json

      - name: Install vendored package dependencies
        working-directory: servers/vinted-mcp
        run: npm ci

      - name: Install worker dependencies
        working-directory: servers/vinted-mcp/worker
        run: npm ci

      - name: Test
        working-directory: servers/vinted-mcp/worker
        run: npm test

  deploy:
    name: Deploy Worker to Cloudflare
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: vinted-mcp-production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            servers/vinted-mcp/package-lock.json
            servers/vinted-mcp/worker/package-lock.json

      - name: Install vendored package dependencies
        working-directory: servers/vinted-mcp
        run: npm ci

      - name: Install worker dependencies
        working-directory: servers/vinted-mcp/worker
        run: npm ci

      - name: Deploy Worker
        working-directory: servers/vinted-mcp/worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
