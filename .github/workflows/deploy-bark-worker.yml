name: Deploy bark-worker

on:
  push:
    branches:
      - main
    paths:
      - servers/bark-worker/**
      - .github/workflows/deploy-bark-worker.yml
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: servers/bark-worker

concurrency:
  group: deploy-bark-worker
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

  deploy:
    name: Deploy Worker to Cloudflare
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: bark-worker-production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Substitute the real KV namespace id
        # The id isn't a credential, but it's account-specific, so it isn't
        # committed. Read from the repo variable hevy-mcp's workflow uses
        # (falling back to a same-named secret), and fail loudly if neither
        # is set rather than handing wrangler an empty id.
        env:
          KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_OAUTH_KV_NAMESPACE_ID || secrets.CLOUDFLARE_OAUTH_KV_NAMESPACE_ID }}
        run: |
          if [ -z "${KV_NAMESPACE_ID}" ]; then
            echo "::error::Set the CLOUDFLARE_OAUTH_KV_NAMESPACE_ID repository variable (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          sed -i "s/00000000000000000000000000000000/${KV_NAMESPACE_ID}/" wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
