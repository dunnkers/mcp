name: Deploy claude-routine-webhook Worker

on:
  push:
    branches:
      - main
    paths:
      - servers/claude-routine-webhook/**
      - .github/workflows/deploy-claude-routine-webhook.yml
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: servers/claude-routine-webhook

concurrency:
  group: deploy-claude-routine-webhook-worker
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: servers/claude-routine-webhook/.nvmrc
          cache: npm
          cache-dependency-path: servers/claude-routine-webhook/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check:types

      - name: Test
        run: npm test

  deploy:
    name: Deploy Worker to Cloudflare
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: claude-routine-webhook-production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: servers/claude-routine-webhook/.nvmrc
          cache: npm
          cache-dependency-path: servers/claude-routine-webhook/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
