name: Deploy crawl4ai-proxy Worker

on:
  push:
    branches:
      - main
    paths:
      - servers/crawl4ai-proxy/**
      - .github/workflows/deploy-crawl4ai-proxy.yml
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: servers/crawl4ai-proxy

concurrency:
  group: deploy-crawl4ai-proxy-worker
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: servers/crawl4ai-proxy/.nvmrc
          cache: npm
          cache-dependency-path: servers/crawl4ai-proxy/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type check
        run: npm run check:types

      - name: Test
        run: npm test

  deploy:
    name: Deploy Worker to Cloudflare
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: crawl4ai-proxy-production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: servers/crawl4ai-proxy/.nvmrc
          cache: npm
          cache-dependency-path: servers/crawl4ai-proxy/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
