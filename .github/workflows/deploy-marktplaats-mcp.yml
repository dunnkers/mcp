name: Deploy marktplaats-mcp Worker

on:
  push:
    branches:
      - main
    paths:
      - servers/marktplaats-mcp/**
      - .github/workflows/deploy-marktplaats-mcp.yml
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: servers/marktplaats-mcp

concurrency:
  group: deploy-marktplaats-mcp-worker
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: servers/marktplaats-mcp/.nvmrc
          cache: npm
          cache-dependency-path: servers/marktplaats-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check:types

      - name: Test
        run: npm test

  deploy:
    name: Deploy Worker to Cloudflare
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: marktplaats-mcp-production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: servers/marktplaats-mcp/.nvmrc
          cache: npm
          cache-dependency-path: servers/marktplaats-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Substitute the real KV namespace id
        env:
          KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_OAUTH_KV_NAMESPACE_ID }}
        run: |
          sed -i "s/00000000000000000000000000000000/${KV_NAMESPACE_ID}/" wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
