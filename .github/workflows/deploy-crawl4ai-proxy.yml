name: Deploy crawl4ai-proxy Worker

on:
  push:
    branches:
      - main
    paths:
      - servers/crawl4ai-proxy/**
      - .github/workflows/deploy-crawl4ai-proxy.yml
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: servers/crawl4ai-proxy

concurrency:
  group: deploy-crawl4ai-proxy-worker
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: servers/crawl4ai-proxy/.nvmrc
          cache: npm
          cache-dependency-path: servers/crawl4ai-proxy/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Type check
        run: npm run check:types

      - name: Test
        run: npm test

  deploy:
    name: Deploy Worker to Cloudflare
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: crawl4ai-proxy-production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: servers/crawl4ai-proxy/.nvmrc
          cache: npm
          cache-dependency-path: servers/crawl4ai-proxy/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Substitute the real KV namespace id and upstream origin
        env:
          KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_OAUTH_KV_NAMESPACE_ID }}
          # Stored as a secret rather than a repository variable purely so
          # GitHub auto-redacts it wherever it appears in this public repo's
          # Actions logs — including `wrangler deploy`'s own bindings
          # summary below, which would otherwise print it in cleartext.
          # Variables (vars.*) don't get that redaction; only secrets do.
          UPSTREAM_ORIGIN: ${{ secrets.CRAWL4AI_UPSTREAM_ORIGIN }}
        run: |
          sed -i "s/00000000000000000000000000000000/${KV_NAMESPACE_ID}/" wrangler.jsonc
          sed -i "s#REPLACE_WITH_CLOUD_RUN_URL#${UPSTREAM_ORIGIN}#" wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
